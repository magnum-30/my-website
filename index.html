<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#050608">

    <title>ماقنوم | حساباتي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div class="particles" id="particles"></div>

    <div class="noise"></div>


    <main class="page">

        <!-- =========================
             البروفايل
        ========================== -->

        <section class="profile">

            <div class="profile-wrapper">

                <div class="profile-halo"></div>

                <div class="profile-image-container">

                    <img
                        src="magnum.png"
                        alt="ماقنوم"
                        class="profile-image"
                    >

                </div>

            </div>

            <h1>Magnum</h1>

            <p class="description">
                حساباتي وروابطي الرسمية
            </p>

            <div class="small-line">
                <span></span>
                <i>✦</i>
                <span></span>
            </div>

        </section>


        <!-- =========================
             الحسابات
        ========================== -->

        <section class="accounts" id="accounts">


            <!-- Creators -->

            <a
                class="account"
                href="https://creators.sa/"
                target="_blank"
                rel="noopener noreferrer"
                data-id="creators"
                data-name="Creators"
            >

                <span class="account-name">
                    Creators
                </span>

                <div class="logo-box creators">

                    <img
                        src="creators.png"
                        alt="Creators"
                    >

                </div>

                <div class="shine"></div>

            </a>


            <!-- YouTube -->

            <a
                class="account"
                href="https://youtube.com/@magnum_3_0"
                data-id="youtube"
                data-name="YouTube"
            >

                <span class="account-name">
                    YouTube
                </span>

                <div class="logo-box youtube">

                    <img
                        src="https://cdn.simpleicons.org/youtube/FFFFFF"
                        alt="YouTube"
                    >

                </div>

                <div class="shine"></div>

            </a>


            <!-- TikTok -->

            <a
                class="account"
                href="https://www.tiktok.com/@magnum_3_0"
                data-id="tiktok"
                data-name="TikTok"
            >

                <span class="account-name">
                    TikTok
                </span>

                <div class="logo-box tiktok">

                    <img
                        src="https://cdn.simpleicons.org/tiktok/FFFFFF"
                        alt="TikTok"
                    >

                </div>

                <div class="shine"></div>

            </a>


            <!-- Instagram -->

            <a
                class="account"
                href="https://www.instagram.com/magnum_3_0"
                data-id="instagram"
                data-name="Instagram"
            >

                <span class="account-name">
                    Instagram
                </span>

                <div class="logo-box instagram">

                    <img
                        src="https://cdn.simpleicons.org/instagram/FFFFFF"
                        alt="Instagram"
                    >

                </div>

                <div class="shine"></div>

            </a>


            <!-- Kick -->

            <a
                class="account"
                href="https://kick.com/magnum-3-0"
                data-id="kick"
                data-name="Kick"
            >

                <span class="account-name">
                    Kick
                </span>

                <div class="logo-box kick">

                    <img
                        src="https://cdn.simpleicons.org/kick/FFFFFF"
                        alt="Kick"
                    >

                </div>

                <div class="shine"></div>

            </a>


            <!-- Twitch -->

            <a
                class="account"
                href="https://www.twitch.tv/magnum_3_0"
                data-id="twitch"
                data-name="Twitch"
            >

                <span class="account-name">
                    Twitch
                </span>

                <div class="logo-box twitch">

                    <img
                        src="https://cdn.simpleicons.org/twitch/FFFFFF"
                        alt="Twitch"
                    >

                </div>

                <div class="shine"></div>

            </a>


            <!-- X -->

            <a
                class="account"
                href="https://x.com/Magnum_3_0"
                data-id="x"
                data-name="X"
            >

                <span class="account-name">
                    X
                </span>

                <div class="logo-box x">

                    <img
                        src="https://cdn.simpleicons.org/x/FFFFFF"
                        alt="X"
                    >

                </div>

                <div class="shine"></div>

            </a>

        </section>


        <!-- =========================
             الفوتر
        ========================== -->

        <footer>

            <span>MAGNUM</span>

            <b>✦</b>

            <span>ماقنوم</span>

        </footer>

    </main>


    <div
        class="toast"
        id="toast"
    ></div>


    <script src="script.js"></script>

</body>
</html>
