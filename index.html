<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050b18">

    <title>Magnum | حساباتي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         الخلفية
    ========================== -->

    <div class="background">

        <div class="blue-glow glow-1"></div>
        <div class="blue-glow glow-2"></div>
        <div class="blue-glow glow-3"></div>

        <div id="particles"></div>

    </div>


    <!-- =========================
         المحتوى
    ========================== -->

    <main class="container">


        <!-- زر القائمة -->

        <button
            class="menu-button"
            aria-label="القائمة"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <!-- سهم أعلى الصفحة -->

        <div class="top-arrow">
            <span>←</span>
        </div>


        <!-- =========================
             البروفايل
        ========================== -->

        <section class="profile">


            <div class="avatar-area">

                <div class="avatar-outer-glow"></div>

                <div class="avatar-ring ring-one"></div>

                <div class="avatar-ring ring-two"></div>

                <div class="avatar-ring ring-three"></div>

                <div class="avatar">

                    <img
                        src="magnum.png"
                        alt="Magnum"
                    >

                </div>

            </div>


            <div class="profile-name">

                <span class="verified">

                    <span class="check">
                        ✓
                    </span>

                </span>

                <h1>
                    Magnum
                </h1>

            </div>


            <div class="profile-divider">

                <span></span>

                <i>✦</i>

                <span></span>

            </div>


            <!-- عداد الزيارات -->

            <div class="views">

                <span>
                    زيارة
                </span>

                <strong id="viewCount">
                    0
                </strong>

                <span class="eye">
                    ◉
                </span>

            </div>


        </section>


        <!-- =========================
             الحسابات
        ========================== -->

        <section
            class="accounts"
            id="accounts"
        >


            <!-- Creators -->

            <a
                class="account"
                data-id="creators"
                data-name="Creators"
                href="https://creators.sa/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-content">

                    <div class="account-text">

                        <strong>
                            Creators
                        </strong>

                        <span>
                            creators.sa
                        </span>

                    </div>

                    <div class="account-logo creators">

                        <img
                            src="creators.png"
                            alt="Creators"
                        >

                    </div>

                </div>

                <span class="account-arrow">
                    ‹
                </span>

                <div class="card-shine"></div>

            </a>


            <!-- YouTube -->

            <a
                class="account"
                data-id="youtube"
                data-name="YouTube"
                href="https://www.youtube.com/@magnum_3_0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-content">

                    <div class="account-text">

                        <strong>
                            YouTube
                        </strong>

                        <span>
                            youtube.com/@magnum_3_0
                        </span>

                    </div>

                    <div class="account-logo youtube">

                        <img
                            src="https://cdn.simpleicons.org/youtube/FFFFFF"
                            alt="YouTube"
                        >

                    </div>

                </div>

                <span class="account-arrow">
                    ‹
                </span>

                <div class="card-shine"></div>

            </a>


            <!-- TikTok -->

            <a
                class="account"
                data-id="tiktok"
                data-name="TikTok"
                href="https://www.tiktok.com/@magnum_3_0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-content">

                    <div class="account-text">

                        <strong>
                            TikTok
                        </strong>

                        <span>
                            tiktok.com/@magnum_3_0
                        </span>

                    </div>

                    <div class="account-logo tiktok">

                        <img
                            src="https://cdn.simpleicons.org/tiktok/FFFFFF"
                            alt="TikTok"
                        >

                    </div>

                </div>

                <span class="account-arrow">
                    ‹
                </span>

                <div class="card-shine"></div>

            </a>


            <!-- Instagram -->

            <a
                class="account"
                data-id="instagram"
                data-name="Instagram"
                href="https://www.instagram.com/magnum_3_0/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-content">

                    <div class="account-text">

                        <strong>
                            Instagram
                        </strong>

                        <span>
                            instagram.com/magnum_3_0
                        </span>

                    </div>

                    <div class="account-logo instagram">

                        <img
                            src="https://cdn.simpleicons.org/instagram/FFFFFF"
                            alt="Instagram"
                        >

                    </div>

                </div>

                <span class="account-arrow">
                    ‹
                </span>

                <div class="card-shine"></div>

            </a>


            <!-- Kick -->

            <a
                class="account"
                data-id="kick"
                data-name="Kick"
                href="https://kick.com/magnum-3-0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-content">

                    <div class="account-text">

                        <strong>
                            Kick
                        </strong>

                        <span>
                            kick.com/magnum-3-0
                        </span>

                    </div>

                    <div class="account-logo kick">

                        <img
                            src="https://cdn.simpleicons.org/kick/FFFFFF"
                            alt="Kick"
                        >

                    </div>

                </div>

                <span class="account-arrow">
                    ‹
                </span>

                <div class="card-shine"></div>

            </a>


            <!-- Twitch -->

            <a
                class="account"
                data-id="twitch"
                data-name="Twitch"
                href="https://www.twitch.tv/magnum_3_0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-content">

                    <div class="account-text">

                        <strong>
                            Twitch
                        </strong>

                        <span>
                            twitch.tv/magnum_3_0
                        </span>

                    </div>

                    <div class="account-logo twitch">

                        <img
                            src="https://cdn.simpleicons.org/twitch/FFFFFF"
                            alt="Twitch"
                        >

                    </div>

                </div>

                <span class="account-arrow">
                    ‹
                </span>

                <div class="card-shine"></div>

            </a>


            <!-- X -->

            <a
                class="account"
                data-id="x"
                data-name="X"
                href="https://x.com/magnum_3_0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-content">

                    <div class="account-text">

                        <strong>
                            X
                        </strong>

                        <span>
                            x.com/magnum_3_0
                        </span>

                    </div>

                    <div class="account-logo x">

                        <img
                            src="https://cdn.simpleicons.org/x/FFFFFF"
                            alt="X"
                        >

                    </div>

                </div>

                <span class="account-arrow">
                    ‹
                </span>

                <div class="card-shine"></div>

            </a>


        </section>


        <!-- =========================
             الفوتر
        ========================== -->

        <footer>

            <span>
                Magnum ©
            </span>

        </footer>


    </main>


    <script src="script.js"></script>

</body>

</html>
