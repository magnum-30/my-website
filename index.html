<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#03070f">

    <title>Magnum | حساباتي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- الخلفية -->
    <div class="background">

        <div class="aurora aurora-one"></div>
        <div class="aurora aurora-two"></div>
        <div class="aurora aurora-three"></div>

        <div class="grid"></div>

        <div id="particles"></div>

    </div>


    <!-- المحتوى -->
    <main class="page">



        <!-- البروفايل -->
        <header class="profile">

            <div class="avatar-wrapper">

                <div class="avatar-halo"></div>

                <div class="avatar-ring ring-1"></div>
                <div class="avatar-ring ring-2"></div>
                <div class="avatar-ring ring-3"></div>

                <div class="avatar">
                    <img
                        src="magnum.png"
                        alt="Magnum"
                    >
                </div>

            </div>


            <div class="name-row">

                <h1>Magnum</h1>

                

            </div>


            <p class="bio">
                جميع حساباتي وروابطي
            </p>


            <div class="profile-line">
                <span></span>
                <i>✦</i>
                <span></span>
            </div>


            <div class="views">

                <span class="views-icon">◉</span>

                <span>زيارة</span>

                <strong id="viewCount">0</strong>

            </div>

        </header>


        <!-- الحسابات -->
        <section
            class="accounts"
            id="accounts"
            aria-label="الحسابات"
        >


            <!-- Creators -->
            <a
                class="account"
                data-id="creators"
                href="https://creators.sa/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-info">

                    <strong>Creators</strong>

                    <span>creators.sa</span>

                </div>

                <div class="account-icon creators">
                    <img
                        src="creators.png"
                        alt="Creators"
                    >
                </div>

                <span class="account-arrow">‹</span>

                <span class="shine"></span>

            </a>


            <!-- YouTube -->
            <a
                class="account"
                data-id="youtube"
                href="https://www.youtube.com/@magnum_3_0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-info">

                    <strong>YouTube</strong>

                    <span>youtube.com/@magnum_3_0</span>

                </div>

                <div class="account-icon">
                    <img
                        src="https://cdn.simpleicons.org/youtube/FFFFFF"
                        alt="YouTube"
                    >
                </div>

                <span class="account-arrow">‹</span>

                <span class="shine"></span>

            </a>


            <!-- TikTok -->
            <a
                class="account"
                data-id="tiktok"
                href="https://www.tiktok.com/@magnum_3_0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-info">

                    <strong>TikTok</strong>

                    <span>tiktok.com/@magnum_3_0</span>

                </div>

                <div class="account-icon">
                    <img
                        src="https://cdn.simpleicons.org/tiktok/FFFFFF"
                        alt="TikTok"
                    >
                </div>

                <span class="account-arrow">‹</span>

                <span class="shine"></span>

            </a>


            <!-- Instagram -->
            <a
                class="account"
                data-id="instagram"
                href="https://www.instagram.com/magnum_3_0/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-info">

                    <strong>Instagram</strong>

                    <span>instagram.com/magnum_3_0</span>

                </div>

                <div class="account-icon">
                    <img
                        src="https://cdn.simpleicons.org/instagram/FFFFFF"
                        alt="Instagram"
                    >
                </div>

                <span class="account-arrow">‹</span>

                <span class="shine"></span>

            </a>


            <!-- Kick -->
            <a
                class="account"
                data-id="kick"
                href="https://kick.com/magnum-3-0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-info">

                    <strong>Kick</strong>

                    <span>kick.com/magnum-3-0</span>

                </div>

                <div class="account-icon">
                    <img
                        src="https://cdn.simpleicons.org/kick/FFFFFF"
                        alt="Kick"
                    >
                </div>

                <span class="account-arrow">‹</span>

                <span class="shine"></span>

            </a>


            <!-- Twitch -->
            <a
                class="account"
                data-id="twitch"
                href="https://www.twitch.tv/magnum_3_0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-info">

                    <strong>Twitch</strong>

                    <span>twitch.tv/magnum_3_0</span>

                </div>

                <div class="account-icon">
                    <img
                        src="https://cdn.simpleicons.org/twitch/FFFFFF"
                        alt="Twitch"
                    >
                </div>

                <span class="account-arrow">‹</span>

                <span class="shine"></span>

            </a>


            <!-- X -->
            <a
                class="account"
                data-id="x"
                href="https://x.com/magnum_3_0"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="account-info">

                    <strong>X</strong>

                    <span>x.com/magnum_3_0</span>

                </div>

                <div class="account-icon">
                    <img
                        src="https://cdn.simpleicons.org/x/FFFFFF"
                        alt="X"
                    >
                </div>

                <span class="account-arrow">‹</span>

                <span class="shine"></span>

            </a>


        </section>


        <footer>
            Magnum ©
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
